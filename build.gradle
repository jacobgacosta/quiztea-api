plugins {
    id "org.jetbrains.kotlin.jvm" version "2.0.20"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url 'https://repo.gradle.org/gradle/libs-releases' }
    mavenLocal()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.0.20")
    implementation "org.jetbrains.kotlin:kotlin-script-runtime:2.0.20"
    implementation "software.amazon.awssdk:dynamodb:2.28.9"
    implementation "software.amazon.awssdk:aws-core:2.28.9"
    implementation 'software.amazon.awssdk:sdk-core:2.31.33'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('libs/octopus-4.0.0.jar')
}

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(21)
}
